name: R-CMD-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: R ${{ matrix.r }}
    strategy:
      fail-fast: false
      matrix:
        r: [release]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - name: Resolve antitrust refactor SHA
        id: antitrust
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/luciu5/antitrust.git refs/heads/refactor | awk 'NR == 1 { print $1 }')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "coordination: $(git rev-parse HEAD)"
            echo "antitrust refactor: $sha"
          } | tee dependency-shas.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      - name: Install exact antitrust refactor
        env:
          ANTITRUST_SHA: ${{ steps.antitrust.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_dir="$(mktemp -d)"
          git clone --no-checkout https://github.com/luciu5/antitrust.git "$checkout_dir"
          git -C "$checkout_dir" checkout --detach "$ANTITRUST_SHA"
          checked_out_sha="$(git -C "$checkout_dir" rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$ANTITRUST_SHA" ]]; then
            echo "::error::Checked-out antitrust SHA $checked_out_sha does not match $ANTITRUST_SHA" >&2
            exit 1
          fi
          Rscript --vanilla - "$checkout_dir" <<'RSCRIPT'
          args <- commandArgs(trailingOnly = TRUE)
          desc <- read.dcf(file.path(args[[1]], "DESCRIPTION"))[1, ]
          imports <- desc[["Imports"]]
          if (!is.na(imports) && nzchar(imports)) {
              packages <- trimws(strsplit(imports, ",", fixed = TRUE)[[1]])
              packages <- sub("\\s*\\(.*$", "", packages)
              packages <- packages[nzchar(packages)]
              missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
              if (length(missing)) {
                  install.packages(missing, repos = "https://cloud.r-project.org")
              }
          }
          RSCRIPT
          R CMD INSTALL --no-multiarch "$checkout_dir"
          line="antitrust installed from verified checkout SHA: $checked_out_sha"
          echo "$line" | tee -a dependency-shas.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check package
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")'

      - name: Upload dependency SHAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-shas
          path: dependency-shas.txt
