name: R-CMD-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: R ${{ matrix.r }}
    strategy:
      fail-fast: false
      matrix:
        r: [release]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - name: Resolve antitrust refactor SHA
        id: antitrust
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/luciu5/antitrust.git refs/heads/refactor | awk 'NR == 1 { print $1 }')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "coordination: $(git rev-parse HEAD)"
            echo "antitrust refactor: $sha"
          } | tee dependency-shas.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      - name: Install exact antitrust refactor
        env:
          ANTITRUST_SHA: ${{ steps.antitrust.outputs.sha }}
        shell: Rscript {0}
        run: |
          install.packages("remotes", repos = "https://cloud.r-project.org")
          expected_sha <- Sys.getenv("ANTITRUST_SHA")
          archive <- tempfile(fileext = ".tar.gz")
          archive_url <- paste0(
            "https://codeload.github.com/luciu5/antitrust/tar.gz/",
            expected_sha
          )
          download.file(archive_url, archive, mode = "wb", quiet = TRUE)
          members <- utils::untar(archive, list = TRUE)
          top_level <- unique(sub("/.*$", "", members[nzchar(members)]))
          expected_top_level <- paste0("antitrust-", expected_sha)
          if (length(top_level) != 1L || !identical(top_level, expected_top_level)) {
            stop(
              paste0(
                "Antitrust codeload archive prefix (", paste(top_level, collapse = ", "),
                ") does not match resolved SHA (", expected_top_level, ")."
              )
            )
          }
          extract_dir <- tempfile("antitrust-")
          dir.create(extract_dir)
          utils::untar(archive, exdir = extract_dir)
          source_dir <- file.path(extract_dir, expected_top_level)
          remotes::install_deps(source_dir, dependencies = TRUE, upgrade = "never")
          remotes::install_local(source_dir, dependencies = FALSE, upgrade = "never")
          line <- paste0("antitrust installed from verified codeload SHA: ", expected_sha)
          write(line, file = "dependency-shas.txt", append = TRUE)
          cat(line, "\n")
          if (!identical(sub("^antitrust-", "", top_level), expected_sha)) {
            stop("Verified antitrust codeload SHA does not match ANTITRUST_SHA.")
          }

      - name: Check package
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")'

      - name: Upload dependency SHAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-shas
          path: dependency-shas.txt
